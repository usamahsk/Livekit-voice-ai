services:
  # LiveKit Voice Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.local
    environment:
      - CONFIG_PATH=/app/shared/config.json
    volumes:
      - config_vol:/app/shared
    restart: unless-stopped

  # Web Control Panel (proxied by Nginx → port 8000)
  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    env_file: .env.local
    environment:
      - CONFIG_PATH=/app/shared/config.json
    volumes:
      - config_vol:/app/shared
    ports:
      - "127.0.0.1:9090:8000"
    restart: unless-stopped
    depends_on:
      - agent

volumes:
  config_vol:
    driver: local
