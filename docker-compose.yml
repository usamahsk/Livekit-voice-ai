services:
  # LiveKit Voice Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.local
    environment:
      - CONFIG_PATH=/app/shared/config.json
    volumes:
      - config_vol:/app/shared
    # Keeps the agent connected to your local LiveKit server
    network_mode: "host" 
    restart: unless-stopped

  # Web Control Panel (proxied by Nginx → port 8000)
  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    env_file: .env.local
    environment:
      - CONFIG_PATH=/app/shared/config.json
    volumes:
      - config_vol:/app/shared
    # This brings back your port mapping capability!
    ports:
      - "127.0.0.1:9090:8000"
    # We add extra_hosts so the WebUI container can find the agent on the host network
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    depends_on:
      - agent

volumes:
  config_vol:
    driver: local