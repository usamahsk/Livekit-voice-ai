services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - agent-config:/app/data

  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "src/web_server.py"]
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - agent-config:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from builder.larynxai.in --to web-server:8000

volumes:
  agent-config:
  caddy_data:
  caddy_config:
