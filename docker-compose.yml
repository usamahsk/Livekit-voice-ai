services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - agent-config:/app/data

  web-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "src/web_server.py"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - agent-config:/app/data

volumes:
  agent-config:
