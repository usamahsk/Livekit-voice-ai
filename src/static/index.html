<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Agent Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: hsl(224,25%,7%);
      --card: rgba(18,22,35,0.75);
      --border: rgba(255,255,255,0.08);
      --accent: hsl(263,70%,55%);
      --accent-h: hsl(263,70%,65%);
      --text: hsl(0,0%,94%);
      --muted: hsl(220,10%,58%);
      --success: hsl(142,72%,45%);
      --danger: hsl(0,70%,55%);
      --premium: hsl(263,70%,55%);
      --standard: hsl(200,80%,50%);
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif;transition:border-color .2s,box-shadow .2s,background-color .25s,opacity .25s;}
    body{background:var(--bg);background-image:radial-gradient(at 0% 0%,hsla(263,70%,25%,.18) 0,transparent 55%),radial-gradient(at 100% 100%,hsla(200,80%,25%,.12) 0,transparent 55%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

    /* ── Header ── */
    header{padding:1.25rem 2rem;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);background:rgba(10,12,20,.55);position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;}
    .logo{display:flex;align-items:center;gap:.75rem;}
    .logo-icon{width:2rem;height:2rem;background:linear-gradient(135deg,var(--accent),hsl(320,70%,50%));border-radius:8px;box-shadow:0 0 16px rgba(139,92,246,.5);}
    h1{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;background:linear-gradient(to right,#fff,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .live-badge{display:flex;align-items:center;gap:.4rem;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);padding:.3rem .8rem;border-radius:20px;font-size:.8rem;color:var(--success);}
    .live-dot{width:6px;height:6px;background:var(--success);border-radius:50%;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5);}50%{box-shadow:0 0 0 5px rgba(16,185,129,0);}}

    /* ── Layout ── */
    main{max-width:1400px;width:100%;margin:2rem auto;padding:0 2rem;display:grid;grid-template-columns:1.3fr 1fr;gap:1.75rem;flex-grow:1;}
    @media(max-width:1024px){main{grid-template-columns:1fr;}}

    /* ── Card ── */
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.75rem;backdrop-filter:blur(16px);box-shadow:0 0 30px rgba(139,92,246,.08);display:flex;flex-direction:column;gap:1.25rem;}
    .card-title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:.5rem;padding-bottom:.85rem;border-bottom:1px solid var(--border);}
    .card-title svg{color:var(--accent);}

    /* ── Form elements ── */
    label{font-size:.85rem;font-weight:500;color:var(--muted);display:block;margin-bottom:.35rem;}
    .form-group{display:flex;flex-direction:column;}
    select,input[type=text]{background:rgba(15,18,30,.8);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.7rem 1rem;font-size:.9rem;outline:none;width:100%;}
    select:focus,input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(139,92,246,.2);}
    textarea{background:rgba(15,18,30,.8);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:1rem;font-size:.85rem;font-family:'Outfit',monospace;line-height:1.6;resize:vertical;min-height:440px;outline:none;width:100%;}
    textarea:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(139,92,246,.2);}
    .char-count{text-align:right;font-size:.75rem;color:var(--muted);margin-top:.3rem;}

    /* ── Mode Toggle ── */
    .mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;background:rgba(15,18,30,.6);border:1px solid var(--border);border-radius:10px;padding:.35rem;}
    .mode-radio{display:none;}
    .mode-label{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem .5rem;border-radius:7px;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--muted);border:1px solid transparent;}
    .mode-label .mode-dot{width:8px;height:8px;border-radius:50%;}
    #mode_premium + .mode-label .mode-dot{background:var(--premium);}
    #mode_standard + .mode-label .mode-dot{background:var(--standard);}
    #mode_premium:checked + .mode-label{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(139,92,246,.05));border-color:rgba(139,92,246,.4);color:#fff;}
    #mode_standard:checked + .mode-label{background:linear-gradient(135deg,rgba(14,165,233,.15),rgba(14,165,233,.05));border-color:rgba(14,165,233,.4);color:#fff;}

    /* ── Pipeline panels ── */
    .pipeline-panel{border:1px dashed var(--border);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;background:rgba(255,255,255,.01);}
    .pipeline-panel.hidden{display:none;}
    .pipeline-row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:.9rem;}
    .step-tag{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:5px;padding:.2rem .45rem;font-size:.7rem;font-weight:700;letter-spacing:.5px;color:var(--muted);text-align:center;}

    /* ── Save bar ── */
    .save-bar{display:flex;justify-content:flex-end;padding-top:1.5rem;border-top:1px solid var(--border);margin-top:.5rem;}
    .btn{background:linear-gradient(135deg,var(--accent),hsl(263,70%,42%));color:#fff;border:none;padding:.85rem 2.2rem;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.5rem;box-shadow:0 4px 18px rgba(139,92,246,.4);}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,92,246,.5);}
    .btn:active{transform:translateY(0);}
    .btn.loading{opacity:.7;cursor:default;pointer-events:none;}

    /* ── Mode indicator pill in header ── */
    .mode-pill{display:flex;align-items:center;gap:.4rem;border-radius:20px;padding:.3rem .85rem;font-size:.78rem;font-weight:500;border:1px solid transparent;}
    .mode-pill.premium{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.3);color:hsl(263,70%,80%);}
    .mode-pill.standard{background:rgba(14,165,233,.12);border-color:rgba(14,165,233,.3);color:hsl(200,80%,80%);}
    .mode-pill-dot{width:6px;height:6px;border-radius:50%;}
    .mode-pill.premium .mode-pill-dot{background:var(--premium);box-shadow:0 0 6px var(--premium);}
    .mode-pill.standard .mode-pill-dot{background:var(--standard);box-shadow:0 0 6px var(--standard);}

    /* ── Toast ── */
    .toast{position:fixed;bottom:2rem;right:2rem;background:#10121a;border-radius:10px;padding:.9rem 1.4rem;display:flex;align-items:center;gap:.75rem;transform:translateY(120%);opacity:0;z-index:100;min-width:260px;border:1px solid var(--success);box-shadow:0 10px 30px rgba(0,0,0,.5);}
    .toast.error{border-color:var(--danger);}
    .toast.show{transform:translateY(0);opacity:1;}
    .toast-title{font-weight:600;font-size:.9rem;}
    .toast-desc{font-size:.8rem;color:var(--muted);}
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <h1>Voice Agent Control Panel</h1>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div class="mode-pill premium" id="header_mode_pill">
        <span class="mode-pill-dot"></span>
        <span id="header_mode_label">Premium · Realtime</span>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        LiveKit Cloud
      </div>
    </div>
  </header>

  <main>
    <!-- LEFT: Prompt Editor -->
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        System Prompt
      </div>
      <div class="form-group" style="flex-grow:1;">
        <label for="prompt_text">Agent Instructions</label>
        <textarea id="prompt_text" placeholder="Write the agent's system instructions here…"></textarea>
        <div class="char-count"><span id="char_count">0</span> characters</div>
      </div>
      <div class="save-bar">
        <button class="btn" id="save_btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Apply &amp; Save
        </button>
      </div>
    </div>

    <!-- RIGHT: Voice Pipeline Config -->
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Voice Pipeline
      </div>

      <!-- Session Mode -->
      <div class="form-group">
        <label>Session Mode</label>
        <div class="mode-toggle">
          <input type="radio" name="session_mode" id="mode_premium" class="mode-radio" value="premium" checked>
          <label for="mode_premium" class="mode-label">
            <span class="mode-dot"></span>Premium · Realtime
          </label>
          <input type="radio" name="session_mode" id="mode_standard" class="mode-radio" value="standard">
          <label for="mode_standard" class="mode-label">
            <span class="mode-dot"></span>Standard · Pipeline
          </label>
        </div>
      </div>

      <!-- Premium Panel -->
      <div class="pipeline-panel" id="panel_premium">
        <div style="font-size:.88rem;font-weight:600;color:#fff;margin-bottom:-.25rem;">Google Realtime Config</div>
        <div class="pipeline-row">
          <span class="step-tag">MODEL</span>
          <select id="prem_model">
            <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
            <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp</option>
          </select>
        </div>
        <div class="pipeline-row">
          <span class="step-tag">VOICE</span>
          <select id="prem_voice">
            <option value="Zephyr">Zephyr (Default)</option>
            <option value="Puck">Puck</option>
            <option value="Charon">Charon</option>
            <option value="Kore">Kore</option>
            <option value="Fenrir">Fenrir</option>
            <option value="Aoede">Aoede</option>
          </select>
        </div>
      </div>

      <!-- Standard Pipeline Panel -->
      <div class="pipeline-panel hidden" id="panel_standard">
        <div style="font-size:.88rem;font-weight:600;color:#fff;margin-bottom:-.25rem;">Google STT → Gemini LLM → MiniMax TTS</div>
        <div class="pipeline-row">
          <span class="step-tag">STT</span>
          <select id="std_stt_language">
            <option value="en-IN">English (India)</option>
            <option value="en-US">English (US)</option>
            <option value="hi-IN">Hindi</option>
            <option value="kn-IN">Kannada</option>
            <option value="mr-IN">Marathi</option>
            <option value="ta-IN">Tamil</option>
          </select>
        </div>
        <div class="pipeline-row">
          <span class="step-tag">LLM</span>
          <select id="std_llm_model">
            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
          </select>
        </div>
        <div class="pipeline-row">
          <span class="step-tag">TTS</span>
          <div style="display:flex;flex-direction:column;gap:.5rem;width:100%;">
            <div style="font-size:.78rem;color:var(--muted);">MiniMax Voice ID (leave blank for default)</div>
            <input type="text" id="std_tts_voice" placeholder="e.g. female-shaonv, audiobook_female_1">
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <div>
      <div class="toast-title" id="toast_title">Saved</div>
      <div class="toast-desc" id="toast_desc">Configuration applied to next call.</div>
    </div>
  </div>

  <script>
    const promptEl  = document.getElementById('prompt_text');
    const saveBtn   = document.getElementById('save_btn');
    const toast     = document.getElementById('toast');
    const charCount = document.getElementById('char_count');

    // ── Char counter ──
    promptEl.addEventListener('input', () => {
      charCount.textContent = promptEl.value.length.toLocaleString();
    });

    // ── Mode toggle ──
    const modeRadios = document.querySelectorAll('input[name="session_mode"]');
    const panelPrem  = document.getElementById('panel_premium');
    const panelStd   = document.getElementById('panel_standard');
    const pillEl     = document.getElementById('header_mode_pill');
    const pillLabel  = document.getElementById('header_mode_label');

    function applyMode(mode) {
      if (mode === 'standard') {
        panelPrem.classList.add('hidden');
        panelStd.classList.remove('hidden');
        pillEl.className = 'mode-pill standard';
        pillLabel.textContent = 'Standard · Pipeline';
      } else {
        panelStd.classList.add('hidden');
        panelPrem.classList.remove('hidden');
        pillEl.className = 'mode-pill premium';
        pillLabel.textContent = 'Premium · Realtime';
      }
    }

    modeRadios.forEach(r => r.addEventListener('change', e => applyMode(e.target.value)));

    // ── Show toast ──
    function showToast(title, desc, isError = false) {
      const titleEl = document.getElementById('toast_title');
      const descEl  = document.getElementById('toast_desc');
      titleEl.textContent = title;
      descEl.textContent  = desc;
      toast.className = 'toast' + (isError ? ' error' : '');
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ── Load config ──
    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (!res.ok) throw new Error('Could not load config');
        const c = await res.json();

        // Mode
        const modeRadio = document.getElementById('mode_' + (c.session_mode || 'premium'));
        if (modeRadio) { modeRadio.checked = true; applyMode(c.session_mode); }

        // Prompt
        promptEl.value = c.custom_prompt || '';
        charCount.textContent = promptEl.value.length.toLocaleString();

        // Premium fields
        if (c.premium) {
          const pm = document.getElementById('prem_model');
          const pv = document.getElementById('prem_voice');
          if (pm) pm.value = c.premium.model || 'gemini-3.1-flash-live-preview';
          if (pv) pv.value = c.premium.voice || 'Zephyr';
        }

        // Standard fields
        if (c.standard) {
          const sl = document.getElementById('std_stt_language');
          const lm = document.getElementById('std_llm_model');
          const tv = document.getElementById('std_tts_voice');
          if (sl) sl.value = c.standard.stt_language || 'en-IN';
          if (lm) lm.value = c.standard.llm_model || 'gemini-2.0-flash';
          if (tv) tv.value = c.standard.tts_voice || '';
        }
      } catch(err) {
        console.error('Load error:', err);
      }
    }

    // ── Save config ──
    saveBtn.addEventListener('click', async () => {
      const mode = document.querySelector('input[name="session_mode"]:checked').value;
      const payload = {
        session_mode: mode,
        custom_prompt: promptEl.value,
        premium: {
          model: document.getElementById('prem_model').value,
          voice: document.getElementById('prem_voice').value,
        },
        standard: {
          stt_language: document.getElementById('std_stt_language').value,
          llm_model:    document.getElementById('std_llm_model').value,
          tts_voice:    document.getElementById('std_tts_voice').value,
        }
      };
      saveBtn.classList.add('loading');
      saveBtn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await res.text());
        showToast('✓ Configuration Saved', 'Changes apply to the next incoming call.');
        applyMode(mode);
      } catch(err) {
        showToast('Save Failed', err.message, true);
      } finally {
        saveBtn.classList.remove('loading');
        saveBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Apply &amp; Save';
      }
    });

    window.addEventListener('DOMContentLoaded', loadConfig);
  </script>
</body>
</html>
