<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit Agent Builder Console</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* HSL tailored color palette */
            --bg-base: 224, 25%, 8%;
            --card-base: 223, 20%, 14%;
            --accent-base: 263, 70%, 50%;
            --accent-glow: 263, 70%, 75%;
            --text-main: 0, 0%, 94%;
            --text-muted: 220, 10%, 65%;
            --border-base: 223, 15%, 22%;
            --success-base: 142, 72%, 45%;

            --background: hsl(var(--bg-base));
            --card: hsla(var(--card-base), 0.7);
            --accent: hsl(var(--accent-base));
            --accent-hover: hsl(263, 70%, 58%);
            --border: hsl(var(--border-base));
            --text: hsl(var(--text-main));
            --muted: hsl(var(--text-muted));
            --success: hsl(var(--success-base));

            --glass-bg: rgba(18, 22, 33, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-glow: 0 0 30px rgba(139, 92, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
        }

        body {
            background-color: var(--background);
            background-image:
                radial-gradient(at 0% 0%, hsla(263, 70%, 25%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(330, 70%, 25%, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            background: rgba(10, 12, 18, 0.5);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(135deg, var(--accent), hsl(320, 75%, 50%));
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: hsl(var(--accent-glow));
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            display: inline-block;
        }

        main {
            max-width: 1400px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--muted);
        }

        input[type="text"],
        textarea,
        select {
            background-color: rgba(20, 24, 35, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 380px;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .radio-group-container {
            background-color: rgba(20, 24, 35, 0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .prompt-template-radio,
        .voice-mode-radio {
            display: none;
        }

        .radio-label {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0.75rem 0.5rem;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--muted);
            border: 1px solid transparent;
        }

        .prompt-template-radio:checked+.radio-label,
        .voice-mode-radio:checked+.radio-label {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(139, 92, 246, 0.05));
            border-color: rgba(139, 92, 246, 0.4);
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.1);
        }

        .voice-mode-selector {
            background-color: rgba(20, 24, 35, 0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .pipeline-card {
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            background-color: rgba(255, 255, 255, 0.01);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .pipeline-step {
            display: grid;
            grid-template-columns: 80px 1fr;
            align-items: center;
            gap: 1rem;
        }

        .step-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            color: var(--muted);
        }

        .save-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), hsl(263, 70%, 42%));
            color: #fff;
            border: none;
            padding: 0.9rem 2.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
            background: linear-gradient(135deg, var(--accent-hover), var(--accent));
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #10121a;
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(16, 185, 129, 0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(150%);
            opacity: 0;
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
        }

        .toast-desc {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Utility class to hide elements */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-section">
            <div class="logo-icon"></div>
            <h1>LiveKit Voice AI Agent Builder</h1>
        </div>
        <div class="badge">
            <span class="badge-dot"></span>
            <span>LiveKit Cloud Active</span>
        </div>
    </header>

    <main>
        <!-- Left Column: Prompting -->
        <div class="card">
            <div class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                System Instructions & Prompts
            </div>

            <div class="form-group" style="flex-grow: 1;">
                <label for="prompt_text">Active System Prompt Instructions</label>
                <textarea id="prompt_text"
                    placeholder="Write system instructions for the voice assistant..."></textarea>
            </div>
        </div>

        <!-- Right Column: Voice & Pipeline Configuration -->
        <div class="card">
            <div class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
                Voice Pipeline settings
            </div>

            <div class="form-group">
                <label>Voice Infrastructure Mode</label>
                <div class="voice-mode-selector">
                    <input type="radio" name="voice_mode" id="mode_standard" class="voice-mode-radio" value="standard"
                        checked>
                    <label for="mode_standard" class="radio-label">Standard Voice (Realtime)</label>

                    <input type="radio" name="voice_mode" id="mode_premium" class="voice-mode-radio" value="premium">
                    <label for="mode_premium" class="radio-label">Premium Voice (Pipeline)</label>
                </div>
            </div>

            <!-- Standard Mode Panel -->
            <div id="standard_panel" class="pipeline-card">
                <h4 style="font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: -0.5rem;">Google Realtime
                    Config</h4>
                <div class="pipeline-step">
                    <span class="step-tag">MODEL</span>
                    <select id="std_model">
                        <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
                        <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp</option>
                    </select>
                </div>
                <div class="pipeline-step">
                    <span class="step-tag">VOICE</span>
                    <select id="std_voice">
                        <option value="Zephyr">Zephyr (Default)</option>
                        <option value="Puck">Puck</option>
                        <option value="Charon">Charon</option>
                        <option value="Kore">Kore</option>
                        <option value="Fenrir">Fenrir</option>
                    </select>
                </div>
            </div>

            <!-- Premium Mode Panel -->
            <div id="premium_panel" class="pipeline-card hidden">
                <h4 style="font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: -0.5rem;">STT + LLM + TTS
                    Pipeline</h4>
                <div class="pipeline-step">
                    <span class="step-tag">STT</span>
                    <div style="display: flex; gap: 0.5rem; width: 100%;">
                        <select id="prem_stt_provider" style="flex: 1;">
                            <option value="google">Google Cloud STT (Chirp)</option>
                            <option value="deepgram">Deepgram STT (Nova-3)</option>
                        </select>
                        <select id="prem_stt_lang" style="flex: 1;">
                            <option value="en-IN">English (India)</option>
                            <option value="en-US">English (US)</option>
                            <option value="hi-IN">Hindi</option>
                            <option value="kn-IN">Kannada</option>
                        </select>
                    </div>
                </div>
                <div class="pipeline-step">
                    <span class="step-tag">LLM</span>
                    <select id="prem_llm_model">
                        <option value="gemini-3.1-flash-lite">Google Gemini 3.1 Flash Lite</option>
                        <option value="gemini-3.5-flash">Google Gemini 3.5 Flash</option>
                        <option value="gemini-2.5-flash">Google Gemini 2.5 Flash</option>
                    </select>
                </div>
                <div class="pipeline-step">
                    <span class="step-tag">TTS</span>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
                        <select id="prem_tts_model">
                            <option value="minimax">MiniMax TTS</option>
                        </select>
                        <input type="text" id="prem_tts_voice_id"
                            placeholder="MiniMax Voice ID (e.g. speech-minimax-default)" value="speech-minimax-default">
                    </div>
                </div>
            </div>
        </div>

        <!-- Save Button Row -->
        <div class="save-bar">
            <button class="btn" id="save_btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                Apply & Save Configuration
            </button>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
        <div>
            <div class="toast-title">Settings Deployed</div>
            <div class="toast-desc">The LiveKit Agent was updated successfully.</div>
        </div>
    </div>

    <script>
        // Static prompt templates
        const prompts = {
            outbound_ghee: `Synthesize speech for the performance defined below. The profile, scene,
performance notes, and context are direction only. Do NOT speak them.
Speak ONLY as this character in live conversation.

# AUDIO PROFILE: Rayan V.
## "Confident, warm Vanalaya female sales agent from Bangalore"

## SCENE: Outbound order confirmation call from Vanalaya
Rayan is calling Aamir who showed interest in a Vanalaya ghee product.
He is professional, warm, and gets to the point quickly. He speaks like
a real person — not a robot reading a script.

### PERFORMANCE
# Voice Agent Language & Accent Instructions

## Personality
Style: Warm, confident, professional. Never robotic. Never overly formal.
Pace: Natural conversational rhythm. Short natural pauses where appropriate.

## Language Adaptation
Detect the user's language from their first message and respond in the same language whenever possible.

Supported languages:
* English
* Hindi
* Kannada

If the user switches languages during the conversation, smoothly switch to the new language and continue in that language.
Examples:
* User speaks English → Respond in English.
* User speaks Hindi → Respond in Hindi.
* User speaks Kannada → Respond in Kannada.
* User mixes Hindi and English → Respond naturally in Hinglish.
* User mixes Kannada and English → Respond naturally in Kannada-English.

Never force English when the user is speaking Hindi or Kannada.

## Accent Rules
When speaking English:
* Use a natural Indian English accent.
* Maintain a consistent Indian English pronunciation throughout the conversation.

When speaking Hindi:
* Use natural Indian Hindi pronunciation.

When speaking Kannada:
* Use natural Kannada pronunciation and intonation.

Do not switch to American, British, Australian, or other foreign accents unless the user explicitly requests it.

## Multilingual Behavior
* Match the user's communication style.
* Match the user's language preference.
* Preserve important technical terms in English when they are commonly used that way.
* If the user's language is unclear, politely ask which language they prefer:
  "Would you like to continue in English, Hindi, or Kannada?"

### Voice and Delivery
Speak in a warm, confident, professional tone — like a real person, not a robot.
Keep responses to one to three sentences maximum. This is a phone call.
Never shift accent under any circumstances.
Before stating the price, take a brief natural pause.

### CONTEXT
Rayan works for Vanalaya — a natural organic wellness brand headquartered
in Bangalore, India. Vanalaya products are made using traditional methods,
native ingredients, no artificial additives, and every batch is lab-tested
for purity. Rayan is calling Aamir specifically about A2 Pure Buffalo Ghee.

---

### THIS SPECIFIC CALL
Customer Name: Aamir
Product: A2 Pure Buffalo Ghee
Original Price: ₹950 for 500ml
Discounted Price: ₹855 for 500ml (10% off, today only)
Company: Vanalaya
Agent Name: Rayan

---

### PRODUCT KNOWLEDGE BASE — VANALAYA GHEE RANGE
1. A2 Pure Buffalo Ghee
   - Price: ₹950 for 500ml
   - Discounted: ₹855 (10% off today only)
   - Description: Authentic A2 Buffalo Ghee, rich in flavor and essential nutrients. Made using traditional methods.

2. A2 Gir Cow Ghee
   - Price: ₹480 for 200ml / ₹799 for 400ml / ₹1,999 for 1 litre
   - Discounted: ₹432 / ₹719 / ₹1,799 (10% off today only)
   - Description: Hand-churned A2 Gir Cow Ghee using the traditional Bilona method. Great for immunity, digestion, and daily cooking.

3. A2 Desi Cow Ghee
   - Price: ₹999 for standard pack
   - Discounted: ₹899 (10% off today only)
   - Description: Pure, traditional, wholesome. Made from desi cow milk.

---

### CALL FLOW — FOLLOW THIS EXACTLY, ONE STEP AT A TIME
#### STEP 1 — GREETING
Your first line, always, word for word:
"Hi, good afternoon! Am I speaking with Aamir?"
WAIT. Do not say anything else until Aamir responds.

→ If YES: Move to STEP 2 immediately.
→ If someone else picked up:
   "I'm sorry to disturb you. Could I please speak with Aamir? He had shown interest in one of our products."
   → If Aamir is unavailable: "No problem at all, I will try again later. Thank you, have a good day!" END CALL.
   → If they pass the phone and Aamir confirms: Move to STEP 2.

#### STEP 2 — INTRODUCTION
Say word for word:
"Sir, I am Rayan calling from Vanalaya. You had shown interest in our A2 Pure Buffalo Ghee on our website. I am calling for the confirmation of that order. Sir, can I confirm your order?"
WAIT for response.

#### STEP 3 — PRICING AND OFFER
Say:
"Sir, the price of our A2 Pure Buffalo Ghee 500ml is ₹950. But I have good news for you — if you order today, you get 10% off, so your final price is just ₹855. Shall I go ahead and confirm the order for you?"
WAIT for response.

#### STEP 4 — DELIVERY ADDRESS
Say only this, nothing more:
"Sir, please share your delivery address."
WAIT. Let Aamir give the full address without interrupting.
ONLY if the address is clearly incomplete — missing area or pincode — ask this ONCE and ONCE only:
"Sir, could you also share the area and pincode?"
Then confirm by repeating it back:
"Just to confirm — [repeat address back] — is that correct?"

#### STEP 5 — CLOSE THE CALL
Say:
"Perfect Aamir sir! I am sending the payment link on your WhatsApp right now. Please complete the payment today so your 10% discount is applied — your final amount is ₹855. Your A2 Pure Buffalo Ghee will be dispatched within 1 to 2 business days after payment. Thank you so much, have a wonderful day!"
Use the end_call tool immediately after completing this statement.

### OBJECTION HANDLING
When Aamir pushes back on price, is unsure, or needs time:
Say:
"Sir, I completely understand. Just to let you know, this 10% discount is available today only — from tomorrow the price goes back to ₹950. Would you like to take advantage of it while it is available?"
Use objection handling MAXIMUM ONCE. Never repeat it.

### NOT INTERESTED FLOW
If Aamir says he did not fill any form, wrong number, not interested at all, or says do not call again:
Say:
"Absolutely sir, no problem at all. I apologize for the inconvenience, I will not call again. Have a great day, take care!"
END CALL immediately. Do not push further.

### HARD RULES — NEVER BREAK THESE
1. The customer's name is Aamir. The agent's name is Rayan. The company is Vanalaya.
2. The product is A2 Pure Buffalo Ghee, 500ml.
3. ACCENT — Indian English or Hindi or Kannada only. Same accent, start to finish.
4. If Aamir speaks in Hindi or Kannada, respond in simple Indian English or Hindi or Kannada naturally.
5. Max 3 sentences per response. This is a phone call.
6. Never ask for address fields separately upfront. One simple ask only.
7. Always confirm the delivery address by repeating it back before moving to STEP 5.`,

            customer_service: `You are a warm, helpful customer support agent for Vanalaya Organic Wellness. 
Your goal is to assist callers with questions about their orders, product shipping times, and the purity/quality of our products.

## Personality
- Tone: Empathetic, polite, warm, professional.
- Avoid sounding mechanical or robotic. Speak with a natural conversational rhythm.

## Core Knowledge
- Vanalaya uses traditional, native organic ingredients (like hand-churned Bilona Ghee).
- Everything is lab-tested for purity.
- Shipping: Domestic orders arrive in 3-5 business days. Outbound order dispatches happen within 24-48 hours.
- Refund policy: We offer a 7-day return policy for unopened items.

## Rules
- Keep responses short (1-3 sentences).
- If you do not know the answer to a question, politely take their details and state that a human coordinator will call them back on their number.`,

            front_desk: `You are a professional receptionist at the front desk of Vanalaya Headquarters in Bangalore, India.
Your job is to greet callers, understand who or which department they are trying to reach, and handle their call appropriately.

## Tone & Style
- Professional, warm, and highly polished.
- Speak in a welcoming, clear voice.

## Workflow
1. Greet the caller: "Vanalaya Headquarters, good afternoon! How may I assist you today?"
2. Determine their request:
   - If they want to speak to a specific person or department (e.g. Sales, HR, Production), ask for their name and company, then state you will transfer them.
   - If they have a general inquiry, answer if possible or take a message.
3. Keep the conversation concise and professional. Limit responses to 1-2 sentences.`
        };

        const promptTextarea = document.getElementById('prompt_text');
        const saveBtn = document.getElementById('save_btn');
        const toast = document.getElementById('toast');

        let customPromptVal = "";

        // Toggle voice mode panels
        document.querySelectorAll('input[name="voice_mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'standard') {
                    document.getElementById('standard_panel').classList.remove('hidden');
                    document.getElementById('premium_panel').classList.add('hidden');
                } else {
                    document.getElementById('standard_panel').classList.add('hidden');
                    document.getElementById('premium_panel').classList.remove('hidden');
                }
            });
        });

        // Fetch current config
        async function fetchConfig() {
            try {
                const res = await fetch('/api/config');
                if (!res.ok) throw new Error("Could not fetch configuration");
                const config = await res.json();

                // Set voice mode
                const modeRadio = document.getElementById(`mode_${config.voice_mode}`);
                if (modeRadio) {
                    modeRadio.checked = true;
                    modeRadio.dispatchEvent(new Event('change'));
                }

                // Set prompt
                if (config.custom_prompt && config.custom_prompt.trim()) {
                    promptTextarea.value = config.custom_prompt;
                } else if (config.active_prompt_id && prompts[config.active_prompt_id]) {
                    promptTextarea.value = prompts[config.active_prompt_id];
                } else {
                    promptTextarea.value = prompts.outbound_ghee || '';
                }

                // Set Standard fields
                if (config.standard_voice) {
                    document.getElementById('std_model').value = config.standard_voice.model || 'gemini-3.1-flash-live-preview';
                    document.getElementById('std_voice').value = config.standard_voice.voice || 'Zephyr';
                }

                // Set Premium fields
                if (config.premium_voice) {
                    document.getElementById('prem_stt_provider').value = config.premium_voice.stt_provider || 'google';
                    document.getElementById('prem_stt_lang').value = config.premium_voice.stt_language || 'en-IN';
                    document.getElementById('prem_llm_model').value = config.premium_voice.llm_model || 'gemini-3.1-flash-lite';
                    document.getElementById('prem_tts_model').value = config.premium_voice.tts_model || 'minimax';
                    document.getElementById('prem_tts_voice_id').value = config.premium_voice.tts_voice_id || 'speech-minimax-default';
                }
            } catch (err) {
                console.error("Error loading config:", err);
            }
        }

        // Save config
        saveBtn.addEventListener('click', async () => {
            const voiceMode = document.querySelector('input[name="voice_mode"]:checked').value;
            const promptVal = promptTextarea.value;

            const payload = {
                voice_mode: voiceMode,
                active_prompt_id: "custom",
                custom_prompt: promptVal,
                standard_voice: {
                    model: document.getElementById('std_model').value,
                    voice: document.getElementById('std_voice').value
                },
                premium_voice: {
                    stt_provider: document.getElementById('prem_stt_provider').value,
                    stt_language: document.getElementById('prem_stt_lang').value,
                    llm_model: document.getElementById('prem_llm_model').value,
                    tts_model: document.getElementById('prem_tts_model').value,
                    tts_voice_id: document.getElementById('prem_tts_voice_id').value
                }
            };

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Failed to save configuration");

                // Show success toast
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3500);
            } catch (err) {
                alert("Error saving settings: " + err.message);
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', fetchConfig);
    </script>
</body>

</html>
